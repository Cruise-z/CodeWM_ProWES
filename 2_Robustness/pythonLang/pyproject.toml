[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyCodeObfuscator"        # Name shown by `pip list` / used by `pip install`
version = "0.1.0"
description = "Python code obfuscator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cruise.zrz", email = "cruise.zrz@gmail.com" }
]
license = { text = "MIT" }

# Runtime dependencies (leave empty if there are none)
dependencies = [
  "libcst>=1.8.0",
  "click>=8.1.0",
]

# Optional dependency groups, for example development-only dependencies
[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
# Explicitly specify the top-level package to include (the directory name used in imports)
packages = ["pyCodeObfuscator"]
