[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cStyleCodeObfuscator"        # Name shown in pip list / used by pip install
version = "0.1.0"
description = "C-style code obfuscator for Python"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Cruise.zrz", email = "cruise.zrz@gmail.com" }
]
license = { text = "MIT" }

# Runtime dependencies (leave as an empty list if none)
dependencies = [
]

# Optional dependency groups, for example for development
[project.optional-dependencies]
dev = [
  "pytest>=9",
  "black>=25",
  "mypy>=1.0",
]

[tool.setuptools]
# Explicitly specify the top-level package name to include (the directory name used for import)
packages = ["cStyleCodeObfuscator"]
